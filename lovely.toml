[manifest]
dump_lua = true
priority = 2147483645 # 2147483647 - 2
version = "1.0.0"

# Declare ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.copy]
position = "prepend"
sources = ["prepend/init.lua"]
target = "main.lua"

# Init ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = "cs = bs.load(project.initState)"
payload = '''if utilitools.init then utilitools.init.init() end'''
position = "after"
target = "main.lua"
times = 1

# Prompts ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = 'prof.pop("fg draw")'
payload = '''if utilitools.prompts then utilitools.prompts.imgui() end'''
position = "before"
target = "main.lua"
times = 1

# Hotkeys ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = "PopupManager.update(dt)"
payload = '''if utilitools.update then utilitools.update(dt) end'''
position = "after"
target = "main.lua"
times = 1

# Mouse imgui scrolling ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = "if (not project.useImgui) or (not imgui.love.GetWantCaptureMouse()) then"
payload = '''if utilitools.imgui and project.useImgui then utilitools.imgui.mouse.sx, utilitools.imgui.mouse.sy = x, y end'''
position = "before"
target = "main.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = "te.cleanup()"
payload = '''if utilitools.imgui then utilitools.imgui.mouse.prevSx, utilitools.imgui.mouse.prevSy, utilitools.imgui.mouse.sx, utilitools.imgui.mouse.sy = utilitools.imgui.mouse.sx, utilitools.imgui.mouse.sy, 0, 0 end'''
position = "before"
target = "main.lua"
times = 1
